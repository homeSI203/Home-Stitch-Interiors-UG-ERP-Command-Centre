<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home Stitch ERP Command Centre</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #1F3D2B;
      color: #F5E9DA;
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .box {
      text-align: center;
      max-width: 480px;
      padding: 32px;
    }
    .mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 22px;
      border: 2px solid #C9A24A;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #C9A24A;
      font-size: 28px;
      letter-spacing: 0.04em;
      font-weight: 700;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .tag {
      font-family: "Segoe UI", sans-serif;
      color: #C9A24A;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    p {
      font-family: "Segoe UI", sans-serif;
      color: rgba(245, 233, 218, 0.78);
      line-height: 1.5;
      margin: 0;
    }
    .bar {
      width: 160px;
      height: 3px;
      margin: 22px auto 0;
      background: linear-gradient(90deg, transparent, #C9A24A, transparent);
      border-radius: 99px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="mark">HS</div>
    <h1>Home Stitch Interiors UG</h1>
    <p class="tag">ERP Command Centre</p>
    <p>Opening the till and office workspace…</p>
    <div class="bar"></div>
  </div>
</body>
</html>
